[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle-project"
version = "0.1.0"
description = "Batch AI translation for SRT subtitle files."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "openai>=1.68,<3.0",
    "pydantic>=2.10,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "reportlab[bidi,shaping]>=4.4,<5.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "pyinstaller>=6.16,<7.0",
    "ruff>=0.11,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*", "desktop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
