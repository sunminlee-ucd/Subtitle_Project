name: Patch processor API key source

on:
  push:
    branches:
      - agent/processor-txt-api-key-only

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[api-key-file-only]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/processor-txt-api-key-only
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch desktop processor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("desktop/subtitle_processor.py")
          text = path.read_text(encoding="utf-8")

          old_init = '        self.api_key = tk.StringVar(value=os.getenv("OPENAI_API_KEY", ""))\n'
          if old_init not in text:
              raise SystemExit("Expected OPENAI_API_KEY initializer was not found")
          text = text.replace(old_init, "", 1)

          old_ui = '''        ttk.Label(frame, text="API key override (optional)").grid(
              row=8, column=0, sticky="w", pady=6
          )
          ttk.Entry(frame, textvariable=self.api_key, show="*", width=38).grid(
              row=8, column=1, sticky="ew", pady=6
          )
          '''
          new_ui = '''        ttk.Label(frame, text="API key source").grid(
              row=8, column=0, sticky="w", pady=6
          )
          ttk.Label(frame, text=f"{PRIVATE_API_KEY_FILENAME} (project root)").grid(
              row=8, column=1, sticky="w", pady=6
          )
          '''
          if old_ui not in text:
              raise SystemExit("Expected API key override UI block was not found")
          text = text.replace(old_ui, new_ui, 1)

          old_key = '''        key = self.api_key.get().strip()
          if not key:
              try:
                  key = load_private_api_key()
              except RuntimeError as error:
                  messagebox.showerror("API key required", str(error))
                  return
          '''
          new_key = '''        try:
              key = load_private_api_key()
          except RuntimeError as error:
              messagebox.showerror("API key required", str(error))
              return
          self._append_log(f"\\nAPI key source: {private_api_key_path()}\\n")
          '''
          if old_key not in text:
              raise SystemExit("Expected API key override selection block was not found")
          text = text.replace(old_key, new_key, 1)

          path.write_text(text, encoding="utf-8")

          readme = Path("README.md")
          readme_text = readme.read_text(encoding="utf-8")
          old_readme = '''Desktop settings are restored at the next launch and saved under the current Windows user's local
          application-data folder. Use **Reset to defaults** to restore and immediately save the original
          settings. The API key override is deliberately excluded from the saved settings.

          For the local Windows build, `API key for openAI.txt` in the project root is loaded only when
          translation starts. It may contain either a raw `sk-...` key or an
          `OPENAI_API_KEY="sk-..."` line. The file is ignored by Git and is never bundled into the EXE.
          '''
          new_readme = '''Desktop settings are restored at the next launch and saved under the current Windows user's local
          application-data folder. Use **Reset to defaults** to restore and immediately save the original
          settings.

          The desktop processor always reads `API key for openAI.txt` from the project root when
          translation starts. `OPENAI_API_KEY` environment variables and UI overrides are intentionally
          ignored by the processor. The file may contain either a raw `sk-...` key or an
          `OPENAI_API_KEY="sk-..."` line. The file is ignored by Git and is never bundled into the EXE.
          '''
          if old_readme not in readme_text:
              raise SystemExit("Expected README API-key section was not found")
          readme.write_text(readme_text.replace(old_readme, new_readme, 1), encoding="utf-8")
          PY

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/subtitle_processor.py README.md
          git commit -m "Use processor txt API key only [api-key-file-only]"
          git push origin HEAD:agent/processor-txt-api-key-only
